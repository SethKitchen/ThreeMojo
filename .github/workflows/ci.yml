# Runs the standard-library-only half of the project on every push.
#
# GitHub's hosted runners have no accelerator, so `make check-gpu` is
# deliberately absent: it would skip every hardware test and report success,
# which is the exact thing the skip messages and the uncached `test-gpu` target
# exist to prevent. The GPU half is checked on a machine that has one. The
# exception is its host side, the suites that open no device: the gpu-host
# job installs MAX and runs them, since on a runner with no GPU they still
# test everything they were written to test.
#
# Everything runs through `make ci`, which forces every recipe regardless of
# the build cache. A cache hit from a previous commit is precisely what CI must
# not honor.

name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu:
    name: check-cpu (standard library only)
    runs-on: ubuntu-latest
    # The CPU suites took about 35 minutes once the library passed 150
    # modules, and 87 of the 90 allowed at 273: lint alone is an hour.
    # The next suites ran past it with every step still progressing.
    # This is a hang detector, not a speed target.
    timeout-minutes: 150

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install the pinned Mojo toolchain
        run: |
          uv venv --prompt ThreeMojo
          uv pip install "mojo==1.1.0"
          .venv/bin/mojo --version

      # The native window's suite starts its own X server. Xvfb draws in
      # memory, so the runner needs no display.
      - name: Install Xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      # Formatting, linting, the CPU suites, and the compile-fail cases. No
      # MAX, which is what proves the no-dependencies claim still holds.
      - name: check-cpu
        run: make -B check-cpu

  # Coverage runs beside the CPU suites rather than after them: each takes
  # half an hour or more on a hosted runner, and one after the other ran
  # past every timeout the check job was given.
  coverage:
    name: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install the pinned Mojo toolchain
        run: |
          uv venv --prompt ThreeMojo
          uv pip install "mojo==1.1.0"
          .venv/bin/mojo --version

      # The native window's suite runs under coverage too.
      - name: Install Xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      # Line, branch, condition and MC/DC, all gating: the report exits
      # non-zero if anything is uncovered.
      #
      # COV_BUDGET is raised well above its local default. That default is one
      # second per suite, tuned on a fast many-core machine to catch the
      # instrumenter sending the compiler superlinear; a 2-core hosted runner
      # exceeds it while behaving perfectly. Here it is only a hang detector.
      #
      # It was 300, and three new suites walked the run into the alarm at
      # 8053 items covered. Nothing was slow: each of them compiled and ran
      # in about two seconds under instrumentation, the same as every other
      # small suite. The number was simply a flat one against a total that
      # grows with the library, and 300 had quietly become the ceiling
      # rather than the outlier. A genuine hang is minutes of no progress
      # and blows through any of these numbers, so the detector loses
      # nothing by being generous.
      #
      # 900 then went the same way at 149 instrumented modules: the run was
      # stopped at fifteen minutes with every suite still progressing.
      # 3600 went the same way at 273: the run for 0e0b997 was stopped at
      # the hour, and the next passed with minutes to spare.
      - name: coverage
        run: make -B coverage COV_BUDGET=6000

  # The GPU backend's host side: the suites that import render/gpu.mojo but
  # open no device. They lay out the vertex lanes, the state tables, the
  # texture table and the light buffer, and a lane added without its test
  # fails here. They need MAX, so this job installs it; they need no GPU,
  # so nothing in them skips.
  gpu-host:
    name: test-gpu-host (MAX, no GPU)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install the pinned Mojo toolchain and MAX
        run: |
          uv venv --prompt ThreeMojo
          uv pip install "mojo==1.1.0" "max==26.6.0"
          .venv/bin/mojo --version

      - name: test-gpu-host
        run: make -B test-gpu-host

  # The wiki is generated from docs/wiki/ so the two cannot drift. GitHub
  # creates the wiki repository when its first page is saved in the browser;
  # until then this job warns and does nothing, so a missing wiki does not
  # fail a push that passed every check.
  wiki:
    name: publish wiki
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [cpu, coverage, gpu-host]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Copy docs/wiki to the GitHub wiki
        run: |
          if ! git clone --depth 1 "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.wiki.git" wiki; then
            echo "::warning::The wiki repository does not exist yet. Save its first page in the browser once; docs/wiki/ is published on the next push."
            exit 0
          fi
          rm -f wiki/*.md
          cp docs/wiki/*.md wiki/
          mkdir -p wiki/out
          cp -f out/*.png wiki/out/ 2>/dev/null || true
          cd wiki
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Wiki already up to date."
            exit 0
          fi
          git commit -m "Publish docs/wiki from ${{ github.sha }}"
          git push
